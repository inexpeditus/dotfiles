# i3blocks configuration. Each script prints full text, short text and colour.
separator=false
separator_block_width=15

[vm]
command=~/.config/i3/scripts/vm.sh
interval=5

[gpu]
command=~/.config/i3/scripts/gpu.sh
interval=5

[cpu]
command=~/.config/i3/scripts/cpu.sh
interval=1

[wifi]
command=~/.config/i3/scripts/wifi.sh
interval=5
markup=pango

[battery]
command=~/.config/i3/scripts/battery.sh
interval=30
markup=pango

# Updated on demand: the volume keybindings in i3/config send SIGRTMIN+10.
[mute]
command=~/.config/i3/scripts/mute.sh
interval=once
signal=10

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1
