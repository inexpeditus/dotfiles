[window]
padding = { x = 2, y = 2 }
dynamic_title = true

[font]
size = 8.0
normal = { family = "Liberation mono", style = "" }

[scrolling]
history = 10000

[cursor]
style = { shape = "Underline", blinking = "Always" }
thickness = 0.1

[colors.primary]
background = "#000000"
foreground = "#f9e5b8"

# Claude Code's dark-ansi theme draws your messages as bright white on bright
# black; this flips them to black on the normal text color
[colors.bright]
black = "#f9e5b8"
white = "#000000"

# Cursor in the text color, whatever is under it
[colors.cursor]
cursor = "#f9e5b8"
text = "#000000"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
